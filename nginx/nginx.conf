# MAIN REVERSE PROXY
# This is the entry point for ALL traffic to didriksi.com
# It decides which Docker container handles each request based on the URL path
#
# How it works:
#   Browser -> didriksi.com:443 (HTTPS) -> THIS nginx -> routes to correct container
#   Browser -> didriksi.com:80  (HTTP)  -> redirect to HTTPS

# Rate limit for the public feed API (per client IP)
limit_req_zone $binary_remote_addr zone=feedapi:10m rate=30r/m;
# DataNorge loads a few endpoints per page view (map polygons, sites, macro facts, details)
limit_req_zone $binary_remote_addr zone=datanorgeapi:10m rate=120r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name didriksi.com www.didriksi.com;
    return 301 https://didriksi.com$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name didriksi.com www.didriksi.com;

    ssl_certificate /etc/letsencrypt/live/didriksi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/didriksi.com/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block access to dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # didriksi.com/ -> Landing page container
    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # didriksi.com/coursecatalog/api/ -> FastAPI backend container
    location /coursecatalog/api/ {
        proxy_pass http://coursecatalog-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # didriksi.com/api/ -> activity feed service (landing page live feed + music)
    location /api/ {
        limit_req zone=feedapi burst=20 nodelay;
        proxy_pass http://feed:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # didriksi.com/coursecatalog/ -> React frontend container
    location /coursecatalog/ {
        proxy_pass http://coursecatalog-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # didriksi.com/datanorge/api/ -> DataNorge FastAPI (read-only)
    location /datanorge/api/ {
        limit_except GET { deny all; }
        limit_req zone=datanorgeapi burst=40 nodelay;
        proxy_pass http://datanorge-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # didriksi.com/datanorge/ -> DataNorge web (its own design, not the Win98 theme)
    location /datanorge/ {
        proxy_pass http://datanorge-web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # didriksi.com/housingclassifier/ -> Same landing container, different path
    location /housingclassifier/ {
        proxy_pass http://landing:80/housingclassifier/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
